name: Deploy Docs

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'mkdocs-requirements.txt'
      - '.github/workflows/api-docs.yml'
      - 'bin/build/check-docs-translations.sh'
      - 'bin/build/check-docs-labels.py'
      - 'bin/build/docs-labels-allowlist.txt'
  # A pull request that touches the docs gets the same build and checks, so a
  # broken link, a page left untranslated or a stale screen label stops it
  # before it merges. Only a push to master deploys. Kept out of Verify on
  # purpose: Publish advances stable from Verify, and a docs page should never
  # hold back a release.
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'mkdocs-requirements.txt'
      - '.github/workflows/api-docs.yml'
      - 'bin/build/check-docs-translations.sh'
      - 'bin/build/check-docs-labels.py'
      - 'bin/build/docs-labels-allowlist.txt'
  workflow_dispatch:

# No token scopes by default; each job grants itself only what it needs.
# Keeps Pages write off the build job.
permissions: {}

# Deploys queue one behind another. A pull request's run has its own group, and
# a new push to it cancels the older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history, so each page's "last updated" date comes from git
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: "pip install --only-binary :all: -r mkdocs-requirements.txt"

      - name: Every page has a French twin with the same shape
        run: bash bin/build/check-docs-translations.sh

      - name: Every label a guide quotes exists in the app
        run: python3 bin/build/check-docs-labels.py

      - name: Build site
        run: mkdocs build --strict

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
