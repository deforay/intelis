# Static analysis on SonarQube Cloud (project deforay_vlsm). Findings show up
# as GitHub code scanning alerts. Needs the SONAR_TOKEN repository secret.

name: SonarCloud analysis

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

# No token scopes by default; the job grants itself only what it needs.
permissions: {}

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # lets SonarCloud decorate PRs with the analysis
    # Pull requests from forks get no secrets, so the scan could only fail there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history, so new-code detection and blame are accurate.
          fetch-depth: 0

      # sonarqube-scan-action replaces the deprecated sonarcloud-github-action,
      # whose bundled Java 17 SonarCloud no longer accepts. This one downloads
      # the Java runtime the scanner needs. Pinned to v8.2.1.
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=deforay_vlsm
            -Dsonar.organization=deforay
