name: Verify

on:
  # A branch push is not on this list: git ship opens a pull request for it at
  # once, and that run is the one the ruleset waits on. Running both tested the
  # same commit twice and competed for runners with the run that mattered.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# No token scopes by default; each job grants itself only what it needs.
permissions: {}

# A new push to a pull request makes its older run worthless, so that one is
# cancelled. Every master run keeps its own group: Publish advances stable from
# master runs that succeed, and a cancelled one publishes nothing.
concurrency:
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Check for conflict markers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Fail if conflict markers are present
        run: |
          # Match the conflict opener/closer at start of line (with a space or
          # end-of-line after the 7 chars). Bare "=======" is skipped on purpose
          # -- it appears legitimately in Markdown/reST underlines.
          if grep -rnE '^(<{7}|>{7})( |$)' \
               --binary-files=without-match \
               --exclude-dir=.git \
               --exclude-dir=vendor \
               --exclude-dir=node_modules \
               .; then
            echo "::error::Merge conflict markers found — resolve them before merging."
            exit 1
          fi
          echo "No conflict markers found."

  di-container:
    name: DI container compiles
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: json, mbstring
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Provide a config (per-instance config.*.php is gitignored)
        run: cp configs/config.production.dist.php configs/config.production.php

      - name: Compile the DI container
        # Forces PHP-DI compilation in CLI so a definition the container cannot
        # autowire (e.g. an exception with a required constructor arg) fails CI
        # instead of 500-ing production, where the container is compiled lazily.
        run: composer check-di

      # Rules the codebase states in one place and has to apply in many: every
      # surface counting rejections also excludes cancelled samples, and an
      # incoming sync cannot overwrite a column the lab owns. Both drifted before
      # and were found months later by someone grepping, which is the wrong tool
      # -- the surfaces are near-identical blocks that differ in small ways, and a
      # regex written to audit them has twice reported correct code as broken.
      # Reads source only, so it needs no database.
      - name: Shared invariants hold
        run: composer check-invariants

  interface-api-tests:
    name: Interface API tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: json, mbstring
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Integration runs in its own jobs, against a server. Left in here it skips
      # every test, but only after starting a PHP process for each one that runs
      # isolated, which was most of this job's minute.
      - name: Run PHPUnit
        run: composer test -- --exclude-testsuite Integration

      - name: Check coding style
        # Path list lives in composer.json (cs-check) so `composer qc` runs the same set.
        run: |
          composer cs-check
          vendor/bin/yaml-lint docs/api/openapi.yaml \
            .github/workflows/no-conflict-markers.yml

  php-syntax:
    name: Every PHP file parses
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      # A parse error that reaches an installation is a white screen for every
      # user of that lab until somebody notices and reports it. Most of app/ is
      # procedural pages that no test ever loads, so nothing else would catch
      # one there.
      # No composer install: php -l does not autoload anything.
      - name: Lint every PHP file
        run: |
          mapfile -t files < <(find app bin public sys tests -name '*.php')
          echo "Linting ${#files[@]} files…"
          if ! printf '%s\0' "${files[@]}" | xargs -0 -P 4 -n 1 php -l > lint.log 2>&1; then
            grep -v '^No syntax errors' lint.log | head -40
            echo "::error::PHP syntax errors — see above."
            exit 1
          fi
          echo "OK — ${#files[@]} files parse."

  # The integration suite takes minutes in one process, mostly PHP start-up for
  # the tests that run isolated, so it is split across parallel jobs. Each shard
  # repeats the whole fresh install first: the setup is under a minute and runs
  # in parallel, and it keeps every shard on exactly the server state the suite
  # always had.
  integration:
    name: Fresh install + integration (${{ matrix.shard }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The PDF tests are the only ones that need poppler, so they get a shard
        # of their own. The rest are dealt out round-robin.
        shard: [pdf, 1, 2, 3, 4, 5, 6, 7, 8]
    env:
      SHARDS: 8
    steps:
      # Started by hand rather than as a `services:` container because the
      # server needs two flags a service block cannot pass. setup.sh writes both
      # into my.cnf on every install, and the schema does not load without
      # them: form_vl is wide enough that innodb_strict_mode=1 refuses to
      # create it ("Row size too large (> 8126)"). Reproducing a lab's server
      # settings is part of proving a fresh install works.
      #
      # Everything after those two flags gives up durability, which a database
      # thrown away after the run does not need. Data on tmpfs and no fsync,
      # binlog or doublewrite halved the suite's run time and changes nothing a
      # query can observe.
      #
      # First, in the background, and not waited for here. Pulling the image
      # and initialising the server take about 35 seconds, which the checkout
      # and composer steps below now cover instead of waiting on.
      #
      # The PDF output tests and BatchPdfPrintTest read each PDF with pdfinfo,
      # pdftotext and pdfimages, and skip their checks without them. Installed
      # explicitly rather than trusting the runner image, and in the
      # background too: apt-get update has taken anywhere from 10 to 90
      # seconds, depending on the mirror. The install is tried against the
      # image's package lists first, and updates them only if that fails.
      - name: Start MySQL configured the way an install configures it
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          nohup docker run -d --name mysql -p 3306:3306 --tmpfs /var/lib/mysql:rw \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=vlsm \
            mysql:8.0 --innodb-strict-mode=0 --sql-mode= \
            --skip-log-bin --innodb-flush-log-at-trx-commit=0 \
            --innodb-doublewrite=0 --innodb-flush-method=nosync \
            > "$RUNNER_TEMP/mysql-start.log" 2>&1 &
          if [ "$SHARD" = pdf ]; then
            nohup sh -c '
              install="sudo apt-get install -y -qq --no-install-recommends poppler-utils"
              $install || { sudo apt-get update -qq && $install; }
              echo $? > "$RUNNER_TEMP/poppler.done"
            ' > "$RUNNER_TEMP/poppler.log" 2>&1 &
          fi

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: gd, zip, pdo, pdo_mysql, mysqli, json, curl, gettext, openssl, fileinfo, sodium, zlib, intl, bcmath
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Wait for MySQL
        run: |
          # The entrypoint runs a temporary server over the unix socket while
          # it initialises, then stops it and starts the real one. A socket
          # probe answers during that window, so the seed step that follows
          # lands in the restart and dies with "Can't connect to local MySQL
          # server through socket". That temporary server is started with
          # networking off, so a TCP probe is the one that waits for the server
          # still running afterwards.
          for _ in $(seq 1 60); do
            docker exec mysql mysql -uroot -proot --protocol=TCP -h 127.0.0.1 \
              -e 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done
          if ! docker exec mysql mysql -uroot -proot --protocol=TCP -h 127.0.0.1 \
            -e 'SELECT VERSION()'; then
            cat "$RUNNER_TEMP/mysql-start.log"
            exit 1
          fi

      - name: Seed the baseline schema
        run: |
          docker exec -i mysql mysql -uroot -proot vlsm < sql/init.sql
          echo "baseline: $(docker exec mysql mysql -uroot -proot -N -B vlsm \
            -e "SELECT value FROM system_config WHERE name='sc_version'")"

      - name: Point the app at it
        run: |
          cp configs/config.production.dist.php configs/config.production.php
          sed -i '/^return \$systemConfig;$/d' configs/config.production.php
          cat >> configs/config.production.php <<'PHP'
          $systemConfig['database']['host']     = '127.0.0.1';
          $systemConfig['database']['username'] = 'root';
          $systemConfig['database']['password'] = 'root';
          $systemConfig['database']['db']       = 'vlsm';
          $systemConfig['database']['port']     = 3306;
          return $systemConfig;
          PHP
          php -l configs/config.production.php

      # Every migration, in order, against the baseline — the same path a new
      # install takes. Nothing else runs sys/migrations/ before a lab does.
      - name: Replay every migration
        run: composer migrate

      - name: Schema ends up at the app version
        run: |
          app=$(php -r 'require "app/system/version.php"; echo VERSION;')
          db=$(docker exec mysql mysql -uroot -proot -N -B vlsm \
            -e "SELECT value FROM system_config WHERE name='sc_version'")
          echo "app ${app} / schema ${db}"
          if [ "$app" != "$db" ]; then
            echo "::error::app is ${app} but a fresh install migrates only to ${db}"
            exit 1
          fi

      # A missing tool fails the shard here. Left to the tests, it would only
      # skip their checks, and the shard would pass.
      - name: Wait for poppler
        if: matrix.shard == 'pdf'
        run: |
          for _ in $(seq 1 120); do
            [ -f "$RUNNER_TEMP/poppler.done" ] && break
            sleep 1
          done
          cat "$RUNNER_TEMP/poppler.log"
          for tool in pdfinfo pdftotext pdfimages; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is not installed"; exit 1; }
          done

      # PHPUnit 11 cannot shard on its own, so each shard writes a configuration
      # that lists its own files. The split is deterministic, so the shards
      # together always cover every file exactly once.
      - name: Pick this shard's test files
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # Picked by what a test calls rather than by name: a PDF test that
          # lands in a shard without poppler skips its text checks and still
          # passes.
          # The PDF output tests reach poppler through their base class.
          poppler='pdftotext|pdfinfo|pdfimages|PdfFingerprint|PdfOutputTestCase'
          files=()
          i=0
          while IFS= read -r f; do
            if grep -qE "$poppler" "$f"; then
              [ "$SHARD" = pdf ] && files+=("$f")
              continue
            fi
            [ "$SHARD" != pdf ] && [ $((i % SHARDS)) -eq $((SHARD - 1)) ] && files+=("$f")
            i=$((i + 1))
          done < <(find tests/Integration -name '*Test.php' | sort)
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<phpunit bootstrap="tests/bootstrap.php" cacheDirectory="var/phpunit-cache">'
            echo '<testsuites><testsuite name="Integration">'
            printf '<file>%s</file>\n' "${files[@]}"
            echo '</testsuite></testsuites></phpunit>'
          } > phpunit-shard.xml
          echo "${#files[@]} files in shard ${SHARD}:"
          printf '  %s\n' "${files[@]}"
          # ParaTest has no --fail-on-empty-test-suite, so an empty shard is
          # caught here instead.
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::shard ${SHARD} has no test files"
            exit 1
          fi

      # Runs here rather than alongside the unit suite because this is the only job
      # with a server. What these cover is what MySQL itself does with SAVEPOINT and
      # an implicit commit, so a double would prove nothing. The suite skips itself
      # when these are unset, which is what keeps `composer test` green elsewhere.
      - name: Run the integration suite against it
        env:
          INTELIS_TEST_DB_HOST: 127.0.0.1
          INTELIS_TEST_DB_PORT: '3306'
          INTELIS_TEST_DB_USER: root
          INTELIS_TEST_DB_PASS: root
        # Four workers, one per CPU on the runner. ParaTest runs a file at a
        # time per worker, and each file names its own database.
        run: vendor/bin/paratest -c phpunit-shard.xml --processes=4

  # The ruleset requires a check with this name, and a matrix job reports under
  # its shard names instead. This job is that check: it passes only when every
  # shard did.
  fresh-install:
    name: Fresh install migrates
    runs-on: ubuntu-latest
    needs: integration
    if: always()
    permissions: {}
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.integration.result }}
        run: |
          echo "integration shards: ${RESULT}"
          [ "$RESULT" = success ]
