name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check for conflict markers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Fail if conflict markers are present
        run: |
          # Match the conflict opener/closer at start of line (with a space or
          # end-of-line after the 7 chars). Bare "=======" is skipped on purpose
          # -- it appears legitimately in Markdown/reST underlines.
          if grep -rnE '^(<{7}|>{7})( |$)' \
               --binary-files=without-match \
               --exclude-dir=.git \
               --exclude-dir=vendor \
               --exclude-dir=node_modules \
               .; then
            echo "::error::Merge conflict markers found — resolve them before merging."
            exit 1
          fi
          echo "No conflict markers found."

  di-container:
    name: DI container compiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Provide a config (per-instance config.*.php is gitignored)
        run: cp configs/config.production.dist.php configs/config.production.php

      - name: Compile the DI container
        # Forces PHP-DI compilation in CLI so a definition the container cannot
        # autowire (e.g. an exception with a required constructor arg) fails CI
        # instead of 500-ing production, where the container is compiled lazily.
        run: composer check-di

      # Counting rules that have to be applied together. Both times these drifted
      # apart it was found months later by someone grepping, and a grep is the wrong
      # tool: the surfaces assemble their WHERE clause in five different shapes.
      # Reads source only, so it needs no database.
      - name: Counting rules are applied together
        run: composer check-counts

  interface-api-tests:
    name: Interface API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit
        run: composer test

      - name: Check PHP syntax
        run: |
          find app/classes/Contracts/InterfaceApi app/classes/Repositories/InterfaceApi \
            app/classes/Services/InterfaceApi app/classes/HttpHandlers/InterfaceApi \
            app/classes/Http tests -name '*.php' -print0 | xargs -0 -n1 php -l
          find app/classes/Middlewares/Api -name 'Interface*.php' -print0 \
            | xargs -0 -n1 php -l
          php -l app/classes/Exceptions/InterfaceApiException.php
          php -l app/classes/Services/InterfacingService.php
          find app/classes/Services -maxdepth 1 -name "Instrument*.php" -print0 \
            | xargs -0 -n1 php -l
          php -l app/classes/Middlewares/Api/ApiAuthMiddleware.php
          php -l app/facilities/editFacility.php
          php -l app/facilities/interfaceConnectionAction.php
          php -l app/facilities/partials/interface-connections.php
          php -l app/system/di.php
          php -l bin/interface-api.php
          php -l public/api/index.php

      - name: Check coding style
        run: |
          vendor/bin/phpcs --standard=PSR12 \
            app/classes/Contracts/InterfaceApi app/classes/Repositories/InterfaceApi \
            app/classes/Services/InterfaceApi app/classes/HttpHandlers/InterfaceApi \
            app/classes/Http app/classes/Exceptions/InterfaceApiException.php \
            app/classes/Services/InterfacingService.php \
            app/classes/Services/InstrumentActivityService.php \
            app/classes/Services/InstrumentUsageStatisticsService.php \
            app/classes/Middlewares/Api/Interface*.php \
            app/facilities/interfaceConnectionAction.php \
            app/facilities/partials/interface-connections.php tests bin/interface-api.php
          vendor/bin/phpcs --standard=PSR12 --runtime-set ignore_warnings_on_exit 1 \
            app/classes/Middlewares/Api/ApiAuthMiddleware.php app/system/di.php \
            public/api/index.php
          vendor/bin/yaml-lint docs/api/openapi.yaml \
            .github/workflows/no-conflict-markers.yml

  php-syntax:
    name: Every PHP file parses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # A parse error that reaches an installation is a white screen for every
      # user of that lab until somebody notices and reports it. The per-module
      # lint above covers the Interface API; most of app/ is procedural pages
      # that no test ever loads, so nothing else would catch one there.
      # No composer install: php -l does not autoload anything.
      - name: Lint every PHP file
        run: |
          mapfile -t files < <(find app bin public sys tests -name '*.php')
          echo "Linting ${#files[@]} files…"
          if ! printf '%s\0' "${files[@]}" | xargs -0 -P 4 -n 1 php -l > lint.log 2>&1; then
            grep -v '^No syntax errors' lint.log | head -40
            echo "::error::PHP syntax errors — see above."
            exit 1
          fi
          echo "OK — ${#files[@]} files parse."

  fresh-install:
    name: Fresh install migrates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, zip, pdo, pdo_mysql, mysqli, json, curl, gettext, openssl, fileinfo, sodium, zlib, intl, bcmath
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Started by hand rather than as a `services:` container because the
      # server needs two flags a service block cannot pass. setup.sh writes both
      # into my.cnf on every install, and the schema does not load without
      # them: form_vl is wide enough that innodb_strict_mode=1 refuses to
      # create it ("Row size too large (> 8126)"). Reproducing a lab's server
      # settings is part of proving a fresh install works.
      - name: Start MySQL configured the way an install configures it
        run: |
          docker run -d --name mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=vlsm \
            mysql:8.0 --innodb-strict-mode=0 --sql-mode=
          for _ in $(seq 1 60); do
            docker exec mysql mysql -uroot -proot -e 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec mysql mysql -uroot -proot -e 'SELECT VERSION()'

      - name: Seed the baseline schema
        run: |
          docker exec -i mysql mysql -uroot -proot vlsm < sql/init.sql
          echo "baseline: $(docker exec mysql mysql -uroot -proot -N -B vlsm \
            -e "SELECT value FROM system_config WHERE name='sc_version'")"

      - name: Point the app at it
        run: |
          cp configs/config.production.dist.php configs/config.production.php
          sed -i '/^return \$systemConfig;$/d' configs/config.production.php
          cat >> configs/config.production.php <<'PHP'
          $systemConfig['database']['host']     = '127.0.0.1';
          $systemConfig['database']['username'] = 'root';
          $systemConfig['database']['password'] = 'root';
          $systemConfig['database']['db']       = 'vlsm';
          $systemConfig['database']['port']     = 3306;
          return $systemConfig;
          PHP
          php -l configs/config.production.php

      # Every migration, in order, against the baseline — the same path a new
      # install takes. Nothing else runs sys/migrations/ before a lab does.
      - name: Replay every migration
        run: composer migrate

      - name: Schema ends up at the app version
        run: |
          app=$(php -r 'require "app/system/version.php"; echo VERSION;')
          db=$(docker exec mysql mysql -uroot -proot -N -B vlsm \
            -e "SELECT value FROM system_config WHERE name='sc_version'")
          echo "app ${app} / schema ${db}"
          if [ "$app" != "$db" ]; then
            echo "::error::app is ${app} but a fresh install migrates only to ${db}"
            exit 1
          fi

      # Runs here rather than alongside the unit suite because this is the only job
      # with a server. What these cover is what MySQL itself does with SAVEPOINT and
      # an implicit commit, so a double would prove nothing. The suite skips itself
      # when these are unset, which is what keeps `composer test` green elsewhere.
      - name: Run the integration suite against it
        env:
          INTELIS_TEST_DB_HOST: 127.0.0.1
          INTELIS_TEST_DB_PORT: '3306'
          INTELIS_TEST_DB_USER: root
          INTELIS_TEST_DB_PASS: root
        run: vendor/bin/phpunit --testsuite Integration
