  - search
  # Shows each page's last change date, read from git. CI must check out
  # the full history (fetch-depth: 0) or every page shows the build date.
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
      exclude:
        - api/*
  - redirects:
      redirect_maps:
        guides/installing-vlsm-on-windows.md: guides/installing-intelis-on-windows.md
        guides/updating-vlsm-on-windows.md: guides/updating-intelis-on-windows.md
        guides/backing-up-to-remote-server.md: guides/setting-up-off-machine-backups.md
        guides/backing-up-to-windows-machine.md: guides/setting-up-off-machine-backups.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Content tabs let a guide show only the steps for the reader's situation.
  # With the theme's content.tabs.link, choosing a tab once switches every tab
  # set on the page that has the same label.
  # Keeps an ordered list's first number, so steps split by sub-headings
  # continue (7, 8, 9...) instead of restarting at 1.
  - sane_lists
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  # md_in_html and the emoji pair are what make the home page's entry-point
  # cards work: the grid needs Markdown parsed inside a div, and the card icons
  # are Material icon shortcodes rendered inline as SVG.
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/deforay/intelis

# The terminal player for the recorded sessions on the server guides. Kept in
# the repository rather than loaded from a CDN, so the guides play offline and
# from a copy of the site on a lab network. bin/dev/record-casts makes the
# recordings; docs/assets/javascripts/casts.js explains how a page embeds one.
extra_css:
  - assets/asciinema-player/asciinema-player.css
  - assets/stylesheets/casts.css

extra_javascript:
  - assets/asciinema-player/asciinema-player.min.js
  - assets/javascripts/casts.js
