site_name: InteLIS Documentation
site_description: Setup guides, troubleshooting, and API reference for InteLIS
site_url: https://deforay.github.io/intelis/
repo_url: https://github.com/deforay/intelis
repo_name: deforay/intelis

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # navigation.instant is deliberately absent. It is incompatible with the
    # language switcher's contextual link, which is what sends a reader to the
    # same page in the other language instead of dumping them on the home page.
    #
    # navigation.tabs puts the nine top-level sections in a bar across the top,
    # which leaves the sidebar carrying only the pages of the section being read.
    # navigation.sections and navigation.expand were both here and are both gone
    # on purpose: together they rendered all nine sections expanded at once, so
    # every page in the site carried a thirty-five-link sidebar.
    - navigation.tabs
    - navigation.tracking
    - navigation.top
    - toc.follow
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

# This is the site's only table of contents. docs/index.md used to repeat it
# page for page, which meant the home page showed every link twice and the two
# lists drifted apart; it now carries four entry-point cards instead. A new page
# needs adding here, and only here — the cards point at sections, not pages.
nav:
  - Home: index.md
  # Grouped in the order a sample actually travels, so the sidebar reads as the
  # workflow rather than as fifteen equal-weight pages.
  - Using InteLIS:
      - Start here:
          - How a viral load sample moves through InteLIS: user-guides/index.md
          - Sign in and navigate InteLIS: user-guides/signing-in.md
          - Words used in these guides: user-guides/glossary.md
      - Register and receive:
          - Register a viral load test request: user-guides/register-a-request.md
          - Receive samples sent on a manifest: user-guides/receive-referred-samples.md
          - Send samples to a testing lab on a manifest: user-guides/send-samples-on-a-manifest.md
      - Test and record results:
          - Batch samples for testing: user-guides/batch-samples.md
          - Test pooled TB samples on GeneXpert: user-guides/test-pooled-tb-samples.md
          - Capture viral load results: user-guides/capture-results.md
          - Review and approve results: user-guides/approve-results.md
          - Handle failed and held samples: user-guides/failed-and-held-samples.md
      - Release and store:
          - Release results to the requesting facility: user-guides/release-results.md
          - Record where a sample is stored: user-guides/store-samples.md
      - Administration:
          - Administer InteLIS: user-guides/administer-intelis.md
          - Manage users and roles: user-guides/admin-users-and-roles.md
          - Manage facilities and testing labs: user-guides/admin-facilities.md
          - Add or update many facilities at once: user-guides/admin-facilities-bulk-upload.md
          - Set up an instrument: user-guides/admin-instruments.md
          - Connect the Interface Tool with a connection code: user-guides/admin-interface-tool-connections.md
          - Maintain the request form lists: user-guides/admin-module-configuration.md
          - General configuration settings: user-guides/admin-general-configuration.md
          - Monitor and audit InteLIS: user-guides/admin-monitoring.md
          - Use the System Admin area: user-guides/admin-system-administration.md
          - For requesting facilities: user-guides/for-requesting-facilities.md
      - Statuses and reports:
          - Sample statuses: user-guides/sample-statuses.md
          - Viral load reports: user-guides/reports.md
          - Reports for other tests: user-guides/reports-other-tests.md
  - Printable job aids:
      - Job aids: job-aids/index.md
  - Installation:
      - Install on Ubuntu (recommended): guides/installing-intelis-on-ubuntu.md
      - Install with Docker: guides/installing-intelis-with-docker.md
      - Install on Windows: guides/installing-intelis-on-windows.md
      # Connecting an analyzer is a setup task, not a repair. It sat under
      # Troubleshooting, where nobody setting up an instrument would look.
      - Connect an instrument: guides/setting-up-interfacing-tool.md
      - Connect a lab to the STS: guides/connect-lab-to-sts.md
  - Updates:
      - Update on Ubuntu: guides/updating-intelis-on-ubuntu.md
      - Update on Windows: guides/updating-intelis-on-windows.md
  # Moving or rebuilding a machine is a restore, so it sits with the backups
  # it restores from rather than with updates.
  - Backup and restore:
      - Set up off-machine backups: guides/setting-up-off-machine-backups.md
      - Back up to Google Drive with Rclone: guides/backing-up-to-google-drive-with-rclone.md
      - Restore from a backup: guides/restoring-from-backup.md
      - Migrate to another Ubuntu machine: guides/migrating-ubuntu-machines.md
  - Maintenance:
      - Maintenance scripts and tools: guides/maintenance.md
      - Run commands on a lab from the STS: guides/remote-command-plane.md
  - Troubleshooting:
      - Where to start: guides/troubleshooting.md
      - Site will not open: guides/site-will-not-open.md
      - MySQL will not start: guides/mysql-will-not-start.md
      - Browser shows PHP code: guides/browser-shows-php-code.md
      - Forgotten password: guides/forgotten-password.md
      - Fix collation errors: guides/fix-collation-issue.md
      - Permission denied errors: guides/permission-denied-issue.md
      - Update stuck at database migrations: guides/update-stuck-at-migrations.md
      - Results not reaching the STS: guides/sts-sync-not-working.md
      - Analyzer results not arriving: guides/interfacing-results-not-arriving.md
  - Reference:
      - Architecture: ARCHITECTURE.md
      - Engineering standards: engineering-standards.md
      - Remote command plane (design): remote-command-plane.md
      - Release tracks: release-tracks.md

# i18n goes first: it rewrites the file list, and search has to index what it
# produces. English is the default, so any page without a .fr.md alongside it
# falls back to English rather than 404ing. That is why the server guides can
# stay untranslated without breaking the French site.
#
# The Windows guides were renamed when VLSM became InteLIS, and the two backup
# destination guides were merged into one. The redirects keep the published URLs
# working. Add an entry there whenever a page is renamed or merged.
plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          site_name: Documentation InteLIS
          site_description: Guides d'utilisation, guides d'installation et référence API pour InteLIS
          nav_translations:
            Home: Accueil
            Using InteLIS: Utiliser InteLIS
            Start here: Commencer ici
            Register and receive: Enregistrer et réceptionner
            Test and record results: Tester et saisir les résultats
            Release and store: Diffuser et stocker
            Administration: Administration
            Statuses and reports: Statuts et rapports
            How a viral load sample moves through InteLIS: Le parcours d'un échantillon dans InteLIS
            Sign in and navigate InteLIS: Se connecter et naviguer dans InteLIS
            Words used in these guides: Les mots de ces guides
            Register a viral load test request: Enregistrer une demande de test de charge virale
            Receive samples sent on a manifest: Réceptionner des échantillons envoyés avec un manifeste
            Send samples to a testing lab on a manifest: Envoyer des échantillons à un laboratoire avec un manifeste
            Batch samples for testing: Créer un lot pour le test
            Test pooled TB samples on GeneXpert: Tester des échantillons TB groupés sur GeneXpert
            Capture viral load results: Saisir les résultats de charge virale
            Review and approve results: Vérifier et approuver les résultats
            Handle failed and held samples: Gérer les échecs et les échantillons en attente
            Release results to the requesting facility: Diffuser les résultats à la structure demandeuse
            Record where a sample is stored: Enregistrer le stockage d'un échantillon
            Administer InteLIS: Administrer InteLIS
            Manage users and roles: Gérer les utilisateurs et les rôles
            Manage facilities and testing labs: Gérer les structures et les laboratoires d'analyse
            Add or update many facilities at once: Ajouter ou mettre à jour plusieurs structures à la fois
            Set up an instrument: Configurer un instrument
            Connect the Interface Tool with a connection code: Connecter l'outil d'interface avec un code de connexion
            Maintain the request form lists: Entretenir les listes du formulaire de demande
            General configuration settings: Paramètres de la configuration générale
            Monitor and audit InteLIS: Surveiller et auditer InteLIS
            Use the System Admin area: Utiliser l'espace System Admin
            For requesting facilities: Pour les structures demandeuses
            Sample statuses: Statuts des échantillons
            Viral load reports: Rapports charge virale
            Reports for other tests: Rapports des autres tests
            Printable job aids: Aide-mémoires imprimables
            Job aids: Aide-mémoires
            Installation: Installation
            Install on Ubuntu (recommended): InteLIS sur Ubuntu (recommandé)
            Install with Docker: Avec Docker
            Install on Windows: InteLIS sur Windows
            Updates: Mises à jour
            Update on Ubuntu: Mettre à jour InteLIS sur Ubuntu
            Update on Windows: Mettre à jour InteLIS sur Windows
            Migrate to another Ubuntu machine: Migrer entre machines Ubuntu
            Backup and restore: Sauvegarde et restauration
            Set up off-machine backups: Configurer des sauvegardes hors de la machine
