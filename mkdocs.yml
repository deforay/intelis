site_name: InteLIS Documentation
site_description: Setup guides, troubleshooting, and API reference for InteLIS
site_url: https://deforay.github.io/intelis/
repo_url: https://github.com/deforay/intelis
repo_name: deforay/intelis

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # navigation.instant is deliberately absent. It is incompatible with the
    # language switcher's contextual link, which is what sends a reader to the
    # same page in the other language instead of dumping them on the home page.
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

# Keep this list and the one in docs/index.md in the same order. They are the
# site's two tables of contents and they drift apart if edited separately.
nav:
  - Home: index.md
  - Using InteLIS:
      - How a Sample Moves Through InteLIS: user-guides/index.md
      - Signing In and Navigating InteLIS: user-guides/signing-in.md
      - Register a Test Request: user-guides/register-a-request.md
      - Receive Samples Sent on a Manifest: user-guides/receive-referred-samples.md
      - Send Samples on a Manifest: user-guides/send-samples-on-a-manifest.md
      - Batch Samples for Testing: user-guides/batch-samples.md
      - Capture Results: user-guides/capture-results.md
      - Review and Approve Results: user-guides/approve-results.md
      - Handle Failed and Held Samples: user-guides/failed-and-held-samples.md
      - Release Results: user-guides/release-results.md
      - Record Where a Sample Is Stored: user-guides/store-samples.md
      - Administer InteLIS: user-guides/administer-intelis.md
      - For Requesting Facilities: user-guides/for-requesting-facilities.md
      - Sample Statuses: user-guides/sample-statuses.md
      - Viral Load Reports: user-guides/reports.md
  - Printable Job Aids:
      - Job Aids: job-aids/index.md
  - Installation:
      - InteLIS on Ubuntu (Recommended): guides/installing-intelis-on-ubuntu.md
      - Using Docker (Evaluation & Development): guides/installing-intelis-with-docker.md
      - InteLIS on Windows: guides/installing-intelis-on-windows.md
  - Updates & Migration:
      - Updating InteLIS on Ubuntu: guides/updating-intelis-on-ubuntu.md
      - Updating InteLIS on Windows: guides/updating-intelis-on-windows.md
      - Migrating Ubuntu Machines: guides/migrating-ubuntu-machines.md
  - Backup:
      - Google Drive with Rclone: guides/backing-up-to-google-drive-with-rclone.md
      - Another Linux Machine: guides/backing-up-to-remote-server.md
      - Windows Machine (Same Network): guides/backing-up-to-windows-machine.md
      - Restoring from a Backup: guides/restoring-from-backup.md
  - Maintenance:
      - Scripts & Tools: guides/maintenance.md
  - Remote Administration:
      - Remote Command Plane (runbook): guides/remote-command-plane.md
  - Troubleshooting:
      - Fix Collation Mismatch: guides/fix-collation-issue.md
      - Permission Denied Issue: guides/permission-denied-issue.md
      - Setting up Interfacing Tool: guides/setting-up-interfacing-tool.md
  - Reference:
      - Architecture: ARCHITECTURE.md
      - Engineering Standards: engineering-standards.md
      - Remote Command Plane (design): remote-command-plane.md

# i18n goes first: it rewrites the file list, and search has to index what it
# produces. English is the default, so any page without a .fr.md alongside it
# falls back to English rather than 404ing. That is why the server guides can
# stay untranslated without breaking the French site.
#
# The Windows guides were renamed when VLSM became InteLIS. The redirects keep
# the published URLs working. Add an entry there whenever a page is renamed.
plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          site_name: Documentation InteLIS
          site_description: Guides d'utilisation, guides d'installation et référence API pour InteLIS
          nav_translations:
            Home: Accueil
            Using InteLIS: Utiliser InteLIS
            How a Sample Moves Through InteLIS: Le parcours d'un échantillon
            Signing In and Navigating InteLIS: Se connecter et naviguer
            Register a Test Request: Enregistrer une demande de test
            Receive Samples Sent on a Manifest: Réceptionner un colis avec manifeste
            Send Samples on a Manifest: Envoyer des échantillons avec un manifeste
            Batch Samples for Testing: Créer un batch pour le test
            Capture Results: Saisir les résultats
            Review and Approve Results: Vérifier et approuver les résultats
            Handle Failed and Held Samples: Gérer les échecs et les échantillons en attente
            Release Results: Diffuser les résultats
            Record Where a Sample Is Stored: Enregistrer le stockage d'un échantillon
            Administer InteLIS: Administrer InteLIS
            For Requesting Facilities: Pour les structures demandeuses
            Sample Statuses: Statuts des échantillons
            Viral Load Reports: Rapports charge virale
            Printable Job Aids: Aide-mémoires imprimables
            Job Aids: Aide-mémoires
            Installation: Installation
            InteLIS on Ubuntu (Recommended): InteLIS sur Ubuntu (recommandé)
            Using Docker (Evaluation & Development): Avec Docker (évaluation et développement)
            InteLIS on Windows: InteLIS sur Windows
            Updates & Migration: Mises à jour et migration
            Updating InteLIS on Ubuntu: Mettre à jour InteLIS sur Ubuntu
            Updating InteLIS on Windows: Mettre à jour InteLIS sur Windows
            Migrating Ubuntu Machines: Migrer entre machines Ubuntu
            Backup: Sauvegarde
            Google Drive with Rclone: Google Drive avec Rclone
            Another Linux Machine: Une autre machine Linux
            Windows Machine (Same Network): Une machine Windows (même réseau)
            Restoring from a Backup: Restaurer depuis une sauvegarde
            Maintenance: Maintenance
            Scripts & Tools: Scripts et outils
            Remote Administration: Administration à distance
            Remote Command Plane (runbook): Plan de commande à distance (procédure)
            Troubleshooting: Dépannage
            Fix Collation Mismatch: Corriger une incohérence de collation
            Permission Denied Issue: Corriger une erreur de permission
            Setting up Interfacing Tool: Configurer l'outil d'interfaçage
            Reference: Référence
            Architecture: Architecture
            Engineering Standards: Standards d'ingénierie
            Remote Command Plane (design): Plan de commande à distance (conception)
  - search
  - redirects:
      redirect_maps:
        guides/installing-vlsm-on-windows.md: guides/installing-intelis-on-windows.md
        guides/updating-vlsm-on-windows.md: guides/updating-intelis-on-windows.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true
  - attr_list

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/deforay/intelis
