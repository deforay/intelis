site_name: InteLIS Documentation
site_description: Setup guides, troubleshooting, and API reference for InteLIS
site_url: https://deforay.github.io/intelis/
repo_url: https://github.com/deforay/intelis
repo_name: deforay/intelis

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # navigation.instant is deliberately absent. It is incompatible with the
    # language switcher's contextual link, which is what sends a reader to the
    # same page in the other language instead of dumping them on the home page.
    #
    # navigation.tabs puts the nine top-level sections in a bar across the top,
    # which leaves the sidebar carrying only the pages of the section being read.
    # navigation.sections and navigation.expand were both here and are both gone
    # on purpose: together they rendered all nine sections expanded at once, so
    # every page in the site carried a thirty-five-link sidebar.
    - navigation.tabs
    - navigation.tracking
    - navigation.top
    - toc.follow
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

# This is the site's only table of contents. docs/index.md used to repeat it
# page for page, which meant the home page showed every link twice and the two
# lists drifted apart; it now carries four entry-point cards instead. A new page
# needs adding here, and only here — the cards point at sections, not pages.
nav:
  - Home: index.md
  # Grouped in the order a sample actually travels, so the sidebar reads as the
  # workflow rather than as fifteen equal-weight pages.
  - Using InteLIS:
      - Start Here:
          - How a Sample Moves Through InteLIS: user-guides/index.md
          - Signing In and Navigating InteLIS: user-guides/signing-in.md
      - Register & Receive:
          - Register a Test Request: user-guides/register-a-request.md
          - Receive Samples Sent on a Manifest: user-guides/receive-referred-samples.md
          - Send Samples on a Manifest: user-guides/send-samples-on-a-manifest.md
      - Test & Record Results:
          - Batch Samples for Testing: user-guides/batch-samples.md
          - Capture Results: user-guides/capture-results.md
          - Review and Approve Results: user-guides/approve-results.md
          - Handle Failed and Held Samples: user-guides/failed-and-held-samples.md
      - Release & Store:
          - Release Results: user-guides/release-results.md
          - Record Where a Sample Is Stored: user-guides/store-samples.md
      - Administration:
          - Administer InteLIS: user-guides/administer-intelis.md
          - Users and Roles: user-guides/admin-users-and-roles.md
          - Facilities and Testing Labs: user-guides/admin-facilities.md
          - Add or Update Many Facilities: user-guides/admin-facilities-bulk-upload.md
          - Instruments: user-guides/admin-instruments.md
          - Interface Tool Connections: user-guides/admin-interface-tool-connections.md
          - Module Configuration: user-guides/admin-module-configuration.md
          - General Configuration: user-guides/admin-general-configuration.md
          - Monitoring and Audit: user-guides/admin-monitoring.md
          - System Admin Area: user-guides/admin-system-administration.md
          - For Requesting Facilities: user-guides/for-requesting-facilities.md
      - Statuses & Reports:
          - Sample Statuses: user-guides/sample-statuses.md
          - Viral Load Reports: user-guides/reports.md
  - Printable Job Aids:
      - Job Aids: job-aids/index.md
  - Installation:
      - InteLIS on Ubuntu (Recommended): guides/installing-intelis-on-ubuntu.md
      - Using Docker: guides/installing-intelis-with-docker.md
      - InteLIS on Windows: guides/installing-intelis-on-windows.md
      # Connecting an analyzer is a setup task, not a repair. It sat under
      # Troubleshooting, where nobody setting up an instrument would look.
      - Connect an Instrument: guides/setting-up-interfacing-tool.md
  - Updates:
      - Updating InteLIS on Ubuntu: guides/updating-intelis-on-ubuntu.md
      - Updating InteLIS on Windows: guides/updating-intelis-on-windows.md
  # Moving or rebuilding a machine is a restore, so it sits with the backups
  # it restores from rather than with updates.
  - Backup & Restore:
      - Setting Up Off-Machine Backups: guides/setting-up-off-machine-backups.md
      - Google Drive with Rclone: guides/backing-up-to-google-drive-with-rclone.md
      - Restoring from a Backup: guides/restoring-from-backup.md
      - Migrating Ubuntu Machines: guides/migrating-ubuntu-machines.md
  - Maintenance:
      - Scripts & Tools: guides/maintenance.md
      - Run Commands on Labs Remotely: guides/remote-command-plane.md
  - Troubleshooting:
      - MySQL Will Not Start: guides/mysql-will-not-start.md
      - Browser Shows PHP Code: guides/browser-shows-php-code.md
      - Fix Collation Mismatch: guides/fix-collation-issue.md
      - Permission Denied Issue: guides/permission-denied-issue.md
      - Analyzer Results Not Arriving: guides/interfacing-results-not-arriving.md
  - Reference:
      - Architecture: ARCHITECTURE.md
      - Engineering Standards: engineering-standards.md
      - Remote Command Plane (design): remote-command-plane.md
      - Release Tracks: release-tracks.md

# i18n goes first: it rewrites the file list, and search has to index what it
# produces. English is the default, so any page without a .fr.md alongside it
# falls back to English rather than 404ing. That is why the server guides can
# stay untranslated without breaking the French site.
#
# The Windows guides were renamed when VLSM became InteLIS, and the two backup
# destination guides were merged into one. The redirects keep the published URLs
# working. Add an entry there whenever a page is renamed or merged.
plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          site_name: Documentation InteLIS
          site_description: Guides d'utilisation, guides d'installation et référence API pour InteLIS
          nav_translations:
            Home: Accueil
            Using InteLIS: Utiliser InteLIS
            Start Here: Commencer ici
            Register & Receive: Enregistrer et réceptionner
            Test & Record Results: Tester et saisir les résultats
            Release & Store: Diffuser et stocker
            Administration: Administration
            Statuses & Reports: Statuts et rapports
            How a Sample Moves Through InteLIS: Le parcours d'un échantillon
            Signing In and Navigating InteLIS: Se connecter et naviguer
            Register a Test Request: Enregistrer une demande de test
            Receive Samples Sent on a Manifest: Réceptionner un colis avec manifeste
            Send Samples on a Manifest: Envoyer des échantillons avec un manifeste
            Batch Samples for Testing: Créer un batch pour le test
            Capture Results: Saisir les résultats
            Review and Approve Results: Vérifier et approuver les résultats
            Handle Failed and Held Samples: Gérer les échecs et les échantillons en attente
            Release Results: Diffuser les résultats
            Record Where a Sample Is Stored: Enregistrer le stockage d'un échantillon
            Administer InteLIS: Administrer InteLIS
            Users and Roles: Utilisateurs et rôles
            Facilities and Testing Labs: Structures et laboratoires
            Add or Update Many Facilities: Ajouter ou mettre à jour plusieurs structures
            Instruments: Automates
            Interface Tool Connections: Connexions de l'outil d'interface
            Module Configuration: Configuration des modules
            General Configuration: Configuration générale
            Monitoring and Audit: Surveillance et audit
            System Admin Area: Espace System Admin
            For Requesting Facilities: Pour les structures demandeuses
            Sample Statuses: Statuts des échantillons
            Viral Load Reports: Rapports charge virale
            Printable Job Aids: Aide-mémoires imprimables
            Job Aids: Aide-mémoires
            Installation: Installation
            InteLIS on Ubuntu (Recommended): InteLIS sur Ubuntu (recommandé)
            Using Docker: Avec Docker
            InteLIS on Windows: InteLIS sur Windows
            Updates: Mises à jour
            Updating InteLIS on Ubuntu: Mettre à jour InteLIS sur Ubuntu
            Updating InteLIS on Windows: Mettre à jour InteLIS sur Windows
            Migrating Ubuntu Machines: Migrer entre machines Ubuntu
            Backup & Restore: Sauvegarde et restauration
            Setting Up Off-Machine Backups: Configurer les sauvegardes hors de la machine
            Google Drive with Rclone: Google Drive avec Rclone
            Restoring from a Backup: Restaurer depuis une sauvegarde
            Maintenance: Maintenance
            Scripts & Tools: Scripts et outils
            Run Commands on Labs Remotely: Lancer des commandes à distance sur les labos
            Troubleshooting: Dépannage
            MySQL Will Not Start: MySQL ne démarre pas
            Browser Shows PHP Code: Le navigateur affiche du code PHP
            Fix Collation Mismatch: Corriger une incohérence de collation
            Permission Denied Issue: Corriger une erreur de permission
            Analyzer Results Not Arriving: Les résultats de l'automate n'arrivent pas
            Connect an Instrument: Connecter un automate
            Reference: Référence
            Architecture: Architecture
            Engineering Standards: Standards d'ingénierie
            Remote Command Plane (design): Plan de commande à distance (conception)
            Release Tracks: Canaux de publication
  - search
  # Shows each page's last change date, read from git. CI must check out
  # the full history (fetch-depth: 0) or every page shows the build date.
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
      exclude:
        - api/*
  - redirects:
      redirect_maps:
        guides/installing-vlsm-on-windows.md: guides/installing-intelis-on-windows.md
        guides/updating-vlsm-on-windows.md: guides/updating-intelis-on-windows.md
        guides/backing-up-to-remote-server.md: guides/setting-up-off-machine-backups.md
        guides/backing-up-to-windows-machine.md: guides/setting-up-off-machine-backups.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Content tabs let a guide show only the steps for the reader's situation.
  # With the theme's content.tabs.link, choosing a tab once switches every tab
  # set on the page that has the same label.
  # Keeps an ordered list's first number, so steps split by sub-headings
  # continue (7, 8, 9...) instead of restarting at 1.
  - sane_lists
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  # md_in_html and the emoji pair are what make the home page's entry-point
  # cards work: the grid needs Markdown parsed inside a div, and the card icons
  # are Material icon shortcodes rendered inline as SVG.
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/deforay/intelis
