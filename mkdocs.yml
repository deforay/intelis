site_name: InteLIS Documentation
site_description: Setup guides, troubleshooting, and API reference for InteLIS
site_url: https://deforay.github.io/intelis/
repo_url: https://github.com/deforay/intelis
repo_name: deforay/intelis

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

# Keep this list and the one in docs/index.md in the same order. They are the
# site's two tables of contents and they drift apart if edited separately.
nav:
  - Home: index.md
  - Installation:
      - Using Docker (Recommended): guides/installing-intelis-with-docker.md
      - InteLIS on Ubuntu: guides/installing-intelis-on-ubuntu.md
      - InteLIS on Windows: guides/installing-intelis-on-windows.md
  - Updates & Migration:
      - Updating InteLIS on Ubuntu: guides/updating-intelis-on-ubuntu.md
      - Updating InteLIS on Windows: guides/updating-intelis-on-windows.md
      - Migrating Ubuntu Machines: guides/migrating-ubuntu-machines.md
  - Backup:
      - Google Drive with Rclone: guides/backing-up-to-google-drive-with-rclone.md
      - Remote Backup Server: guides/backing-up-to-remote-server.md
      - Windows Machine (Same Network): guides/backing-up-to-windows-machine.md
  - Maintenance:
      - Scripts & Tools: guides/maintenance.md
  - Remote Administration:
      - Remote Command Plane (runbook): guides/remote-command-plane.md
  - Troubleshooting:
      - Fix Collation Mismatch: guides/fix-collation-issue.md
      - Permission Denied Issue: guides/permission-denied-issue.md
      - Setting up Interfacing Tool: guides/setting-up-interfacing-tool.md
  - Reference:
      - Architecture: ARCHITECTURE.md
      - Engineering Standards: engineering-standards.md
      - Remote Command Plane (design): remote-command-plane.md

# The Windows guides were renamed when VLSM became InteLIS. These keep the
# published URLs working. Add an entry here whenever a page is renamed.
plugins:
  - search
  - redirects:
      redirect_maps:
        guides/installing-vlsm-on-windows.md: guides/installing-intelis-on-windows.md
        guides/updating-vlsm-on-windows.md: guides/updating-intelis-on-windows.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true
  - attr_list

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/deforay/intelis
