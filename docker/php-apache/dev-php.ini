; Loaded only by docker-compose, which bind-mounts the source into the
; container. The image ships opcache.validate_timestamps=0, which is right for a
; built image whose code cannot change — and wrong here, where the whole point
; of the mount is that the code changes. Without this, an edit on the host has
; no effect until the container is restarted, and the developer is debugging the
; previous version of their own file.
;
; zz- prefix so it loads after custom-php.ini and wins.
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; A container is for developing in; showing the error beats hunting the log.
display_errors = On
display_startup_errors = On
