# Port 80, always: this is the port Apache listens on inside the container.
# APACHE_PORT is the HOST side of the compose mapping "${APACHE_PORT}:80" and
# has no meaning in here. Substituting it produced <VirtualHost *:8081> against
# an Apache listening on 80, so the vhost matched nothing and every request fell
# through to the default site — which is rooted at /var/www/html rather than
# /var/www/html/public, and served .env and sql/init.sql with a 200.
<VirtualHost *:80>
    ServerName ${DOMAIN}
    ServerAlias localhost

    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AddDefaultCharset UTF-8
        Options MultiViews FollowSymLinks
        AllowOverride All
        Order allow,deny
        Allow from all
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

</VirtualHost>
