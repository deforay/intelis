; user.ini
session.cookie_secure = 1
session.cookie_httponly = 1
; Kept in step with the scripted install (configure_php_ini) and the app's own
; idle timer in AppAuthMiddleware, which is capped by gc_maxlifetime.
session.gc_maxlifetime = 28800
; 0 = the cookie lives until the browser closes, matching bootstrap.php
session.cookie_lifetime = 0
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE & ~E_WARNING
display_errors = Off
display_startup_errors = Off
log_errors = On
