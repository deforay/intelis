# SonarQube Cloud automatic analysis settings.
#
# Rules are chosen in the "deforay" organization's quality profiles, not here;
# this file only decides which files are analysed.

sonar.sourceEncoding=UTF-8

# Third-party libraries, generated output, and SQL. Released migrations are
# never edited, and MySQL files are checked against PL/SQL rules that do not
# fit them.
sonar.exclusions=\
  vendor/**,\
  node_modules/**,\
  public/assets/plugins/**,\
  public/assets/css/skins/**,\
  public/assets/css/AdminLTE.css,\
  public/assets/css/bootstrap*.css,\
  public/assets/css/jquery*.css,\
  public/assets/css/multi-select.css,\
  public/assets/css/selectize.css,\
  public/assets/css/tom-select.css,\
  public/assets/js/DYMO.Label.Framework.js,\
  public/assets/js/jasny-bootstrap.js,\
  public/assets/js/jquery*.js,\
  public/assets/js/js.cookie.js,\
  public/assets/js/highcharts*.js,\
  public/assets/js/dayjs*.js,\
  public/assets/js/selectize.js,\
  public/assets/js/toastify.js,\
  public/assets/js/zebra-browserprint.js,\
  **/*.min.js,\
  **/*.min.css,\
  **/*.sql,\
  .ddev/**,\
  dev/**,\
  docs/**,\
  tests/**

# Tests are analysed as tests: security and test-fixture rules do not apply.
# (They must also be excluded above, or they are indexed as sources too and the
# analysis fails.)
sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**
